version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./solar_forecast.db
      - OWM_KEY=${OWM_KEY:-}
      - ART_DIR=training_artifacts
    volumes:
      - ./training_artifacts:/app/training_artifacts
      - ./services:/app/services
      - ./models.py:/app/models.py
      - ./app.py:/app/app.py
      - ./db.py:/app/db.py
    depends_on:
      - db
    networks:
      - solar-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - solar-network

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=solar_forecast
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - solar-network

volumes:
  postgres_data:

networks:
  solar-network:
    driver: bridge
