<!DOCTYPE html>
<html>
<head>
    <title>FastAPI - Solar Forecast API</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@3.52.5/swagger-ui.css">
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    <script>
        // Suppress specific console errors from browser extensions - override immediately
        const originalError = console.error;
        const originalWarn = console.warn;

        console.error = function(...args) {
            // Filter out extension-related errors
            if (args.some(arg => typeof arg === 'string' && (
                arg.includes('Cannot find menu item with id translate-page') ||
                arg.includes('Cannot find menu item with id save-page')
            ))) {
                return; // Suppress these errors
            }
            originalError.apply(console, args);
        };

        console.warn = function(...args) {
            // Filter out Swagger UI deprecation warnings
            if (args.some(arg => typeof arg === 'string' && arg.includes('escaping deep link whitespace'))) {
                return; // Suppress this warning
            }
            originalWarn.apply(console, args);
        };
    </script>
    <script src="https://unpkg.com/swagger-ui-dist@3.52.5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@3.52.5/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: '/openapi.json',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout"
            });
        };
    </script>
</body>
</html>
